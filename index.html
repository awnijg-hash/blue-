<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الإضافات التفاعلية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #2b2100; color: #2c2200; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .mobile-frame { width: 100%; max-width: 430px; height: 100vh; max-height: 900px; background: linear-gradient(135deg, #fce07d 0%, #d4af37 50%, #aa771c 100%); display: flex; flex-direction: column; position: relative; overflow: hidden; border: 2px solid #573f06; box-shadow: 0 0 20px rgba(0,0,0,0.6); }

        #home-screen { flex: 1; background: linear-gradient(145deg, #fde48e 0%, #e6be4ae0 100%); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .screen-header { font-size: 24px; font-weight: bold; text-align: center; color: #3b2c0d; margin-bottom: 20px; }
        .btn-main { background: #fff3c4; color: #3b2c0d; font-weight: bold; padding: 14px; border-radius: 8px; border: 2px solid #7c5d12; font-size: 18px; cursor: pointer; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .add-box { background: #fce89c; border: 2px solid #7c5d12; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: none; flex-direction: column; gap: 8px; }
        .add-box input { width: 100%; padding: 10px; border-radius: 6px; border: 2px solid #7c5d12; background: #fff5cc; color: #3b2c0d; font-size: 16px; font-weight: bold; }
        
        .list-container { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; }
        .list-item { background: #fff5cc; border: 2px solid #7c5d12; border-radius: 8px; padding: 15px; font-size: 20px; font-weight: bold; text-align: center; cursor: pointer; color: #3b2c0d; position: relative; }
        .delete-btn { position: absolute; top: 6px; left: 8px; background: #a83232; color: #fff; border: 1px solid #5c1818; width: 26px; height: 26px; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #details-screen { display: none; flex: 1; background: linear-gradient(145deg, #fde48e 0%, #dfb743 100%); flex-direction: column; padding: 12px; overflow: hidden; position: relative; }
        .details-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 5px; }
        .back-group { display: flex; align-items: center; gap: 6px; }
        .back-btn { background: #a83232; color: #fff; border: 2px solid #5c1818; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .total-badge { background: #fff3c4; color: #3b2c0d; border: 2px solid #7c5d12; padding: 5px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; }
        .comp-title-display { font-size: 16px; font-weight: bold; color: #3b2c0d; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .action-row { display: flex; gap: 6px; }
        .action-row input { flex: 1; padding: 8px; border-radius: 6px; border: 2px solid #7c5d12; background: #fff5cc; color: #3b2c0d; font-size: 16px; font-weight: bold; }
        .btn-add { background: #235c36; color: #fff; padding: 8px 12px; border-radius: 6px; border: 2px solid #11301c; cursor: pointer; font-weight: bold; }
        
        .participants-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .participant-card-mobile { background: #fff5cc; border: 2px solid #7c5d12; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
        .p-name { font-size: 17px; font-weight: bold; color: #3b2c0d; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-right-group { display: flex; align-items: center; gap: 8px; }
        .p-shares-box { background: #fff; color: #3b2c0d; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 16px; min-width: 45px; text-align: center; border: 2px solid #7c5d12; }
        .p-arrows { display: flex; flex-direction: column; gap: 2px; }
        .arrow-btn { background: #e6be4a; color: #3b2c0d; border: 1px solid #7c5d12; border-radius: 4px; width: 24px; height: 18px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        
        .btn-draw { background: #4a287a; color: #fff; border: 2px solid #281442 !important; width: 100%; margin-top: 5px; font-size: 18px; padding: 12px; border-radius: 8px !important; }

        /* النوافذ الداخلية */
        .internal-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(43, 33, 0, 0.85); z-index: 50; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .internal-modal-card { background: linear-gradient(145deg, #fde48e 0%, #d4af37 100%); border: 3px solid #573f06; padding: 20px; border-radius: 12px; width: 100%; max-width: 320px; position: relative; gap: 12px; display: flex; flex-direction: column; }
        .close-x-btn { position: absolute; top: 10px; left: 12px; background: transparent; color: #3b2c0d; border: none; font-size: 22px; font-weight: bold; cursor: pointer; }
        
        #roll-box { font-size: 24px; font-weight: bold; color: #3b2c0d; margin: 15px 0 10px 0; padding: 15px; background: #fff5cc; border-radius: 8px; border: 2px solid #7c5d12; min-height: 95px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        .step-draw-btn { background: #4a287a; color: #fff; border: 2px solid #281442; padding: 10px; font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 5px; }
    </style>
</head>
<body onclick="goFullScreen()">

    <div class="mobile-frame">
        <!-- القائمة الرئيسية -->
        <div id="home-screen">
            <div class="screen-header">القائمة الرئيسية</div>
            <button class="btn-main" onclick="playEffect('click'); toggleAddBox('add-main-container')">+ إضافة جديد</button>
            
            <div id="add-main-container" class="add-box">
                <input type="text" id="new-item-name" placeholder="اكتب الاسم هنا...">
                <button class="btn-add" onclick="addNewItem()">حفظ</button>
            </div>
            
            <div class="list-container" id="list-container"></div>
        </div>

        <!-- نافذة التفاصيل والتحكم بالعناصر -->
        <div id="details-screen">
            <div class="details-top-bar">
                <button class="btn-add" onclick="playEffect('success'); saveRecord()">حفظ</button>
                <div class="comp-title-display" id="active-title">الاسم</div>
                <div class="back-group">
                    <div class="total-badge" id="total-badge" title="العدد الكلي">0</div>
                    <button class="back-btn" onclick="playEffect('click'); goBackHome()">رجوع</button>
                </div>
            </div>

            <button class="btn-main" style="padding: 10px; font-size: 15px; margin-bottom: 5px;" onclick="playEffect('click'); toggleAddBox('add-sub-container')">+ إضافة جديد</button>
            
            <div id="add-sub-container" class="add-box">
                <div class="action-row">
                    <input type="text" id="sub-item-name" placeholder="اسم العنصر...">
                </div>
                <div class="action-row">
                    <input type="number" id="sub-item-val" value="1" min="1" placeholder="العدد">
                    <button class="btn-add" onclick="playEffect('success'); addSubItem()">تأكيد</button>
                </div>
            </div>

            <div class="participants-scroll" id="sub-list-container"></div>

            <button class="btn-main btn-draw" onclick="playEffect('start'); startDraw()">🎯 بدء الاختيار</button>
        </div>

        <!-- نافذة السحب العشوائي الداخلية -->
        <div id="draw-modal" class="internal-modal">
            <div class="internal-modal-card">
                <button class="close-x-btn" onclick="playEffect('click'); closeDrawModal()">×</button>
                <div id="roll-box">جاهز للاختيار...</div>
                <button class="step-draw-btn" onclick="playEffect('step'); nextStepDraw()">⬇</button>
                <button class="btn-add" style="width:100%; margin-top:5px; background:#235c36;" onclick="playEffect('click'); resetDrawModal()">إعادة</button>
            </div>
        </div>

        <!-- نافذة تأكيد الحذف الداخلية -->
        <div id="delete-modal" class="internal-modal">
            <div class="internal-modal-card">
                <h3>تأكيد الحذف</h3>
                <p id="delete-msg" style="font-weight:bold;"></p>
                <div style="display:flex; gap:10px;">
                    <button class="btn-add" style="background:#a83232; flex:1;" onclick="executeDelete()">نعم</button>
                    <button class="btn-add" style="background:#235c36; flex:1;" onclick="closeDeleteModal()">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // تفعيل ملء الشاشة فور أول ضغطة على الجوال
        function goFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        // نظام الأصوات
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playEffect(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            if (type === 'click') {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(400, now + 0.04);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'step') {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'success') {
                [523.25, 659.25, 783.99].forEach((freq, index) => {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(freq, now + (index * 0.06));
                    gain.gain.setValueAtTime(0.1, now + (index * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.06) + 0.15);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + (index * 0.06)); osc.stop(now + (index * 0.06) + 0.15);
                });
            } else if (type === 'start') {
                [400, 600, 800].forEach((freq, index) => {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(freq, now + (index * 0.05));
                    gain.gain.setValueAtTime(0.08, now + (index * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.05) + 0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + (index * 0.05)); osc.stop(now + (index * 0.05) + 0.1);
                });
            }
        }

        let appData = JSON.parse(localStorage.getItem('pureAppData')) || { items: {} };
        let currentOpen = "";
        let pendingDelete = null;
        let drawPool = [];
        let drawIndex = 0;

        window.onload = renderList;

        function save() {
            localStorage.setItem('pureAppData', JSON.stringify(appData));
        }

        function toggleAddBox(id) {
            let box = document.getElementById(id);
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function addNewItem() {
            let input = document.getElementById('new-item-name');
            let name = input.value.trim();
            if (name && !appData.items[name]) {
                playEffect('success');
                appData.items[name] = [];
                save();
                renderList();
                input.value = "";
                toggleAddBox('add-main-container');
            }
        }

        function renderList() {
            let container = document.getElementById('list-container');
            container.innerHTML = "";
            let keys = Object.keys(appData.items);
            if (keys.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#573f06; margin-top:30px; font-size:16px;">لا توجد عناصر مسجلة.<br>اضغط فوق لإضافة جديد!</div>`;
                return;
            }
            keys.forEach(name => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span>${name}</span><button class="delete-btn" onclick="event.stopPropagation(); promptDelete('${name}')">×</button>`;
                div.onclick = () => { playEffect('click'); openDetails(name); };
                container.appendChild(div);
            });
        }

        function promptDelete(name) {
            playEffect('click');
            pendingDelete = name;
            document.getElementById('delete-msg').innerText = `حذف "${name}"؟`;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            playEffect('click');
            pendingDelete = null;
            document.getElementById('delete-modal').style.display = 'none';
        }

        function executeDelete() {
            if (pendingDelete) {
                playEffect('success');
                delete appData.items[pendingDelete];
                save();
                renderList();
            }
            closeDeleteModal();
        }

        function openDetails(name) {
            currentOpen = name;
            document.getElementById('active-title').innerText = name;
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('details-screen').style.display = 'flex';
            renderSubList();
        }

        function goBackHome() {
            document.getElementById('details-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            renderList();
        }

        function addSubItem() {
            let nameInput = document.getElementById('sub-item-name');
            let valInput = document.getElementById('sub-item-val');
            let name = nameInput.value.trim();
            let val = parseInt(valInput.value) || 1;
            if (name) {
                appData.items[currentOpen].push({ name: name, val: val });
                save();
                renderSubList();
                nameInput.value = "";
                valInput.value = "1";
                toggleAddBox('add-sub-container');
            }
        }

        function modifyVal(index, amount) {
            playEffect('step');
            let list = appData.items[currentOpen];
            list[index].val += amount;
            if (list[index].val < 1) list[index].val = 1;
            save();
            renderSubList();
        }

        function renderSubList() {
            let container = document.getElementById('sub-list-container');
            container.innerHTML = "";
            let list = appData.items[currentOpen] || [];
            let total = 0;

            list.forEach((item, idx) => {
                total += item.val;
                let card = document.createElement('div');
                card.className = 'participant-card-mobile';
                card.innerHTML = `
                    <div class="p-name">${idx + 1}. ${item.name}</div>
                    <div class="p-right-group">
                        <div class="p-shares-box">${item.val}</div>
                        <div class="p-arrows">
                            <button class="arrow-btn" onclick="modifyVal(${idx}, 1)">▲</button>
                            <button class="arrow-btn" onclick="modifyVal(${idx}, -1)">▼</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('total-badge').innerText = total;
        }

        function saveRecord() {}

        function startDraw() {
            let list = appData.items[currentOpen];
            if (!list || list.length === 0) return;
            drawPool = [];
            list.forEach(item => {
                for (let i = 0; i < item.val; i++) {
                    drawPool.push(item.name);
                }
            });
            drawPool.sort(() => Math.random() - 0.5);
            drawIndex = drawPool.length;
            updateRollDisplay();
            document.getElementById('draw-modal').style.display = 'flex';
        }

        function updateRollDisplay() {
            let box = document.getElementById('roll-box');
            if (drawIndex > 0) {
                let currentName = drawPool[drawIndex - 1];
                box.innerHTML = `<span style="color:#7c5d12; font-size:36px; font-weight:900;">${drawIndex}</span><span style="color:#3b2c0d; font-size:22px; font-weight:bold; margin-top:4px;">${currentName}</span>`;
            } else {
                box.innerHTML = `<span style="color:#573f06; font-size:22px; font-weight:bold;">🎉 انتهت العناصر!</span>`;
            }
        }

        function nextStepDraw() {
            if (drawIndex > 0) {
                drawIndex--;
                updateRollDisplay();
            }
        }

        function resetDrawModal() {
            let list = appData.items[currentOpen];
            if (!list) return;
            drawPool = [];
            list.forEach(item => {
                for (let i = 0; i < item.val; i++) {
                    drawPool.push(item.name);
                }
            });
            drawPool.sort(() => Math.random() - 0.5);
            drawIndex = drawPool.length;
            updateRollDisplay();
        }

        function closeDrawModal() {
            document.getElementById('draw-modal').style.display = 'none';
        }
    </script>
</body>
</html>

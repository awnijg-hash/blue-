<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق المسابقات الاحترافي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #2b2100; color: #2c2200; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .mobile-frame { width: 100%; max-width: 430px; height: 100vh; background: linear-gradient(135deg, #fce07d 0%, #d4af37 50%, #aa771c 100%); display: flex; flex-direction: column; overflow: hidden; border: 2px solid #573f06; }
        #home-screen, #details-screen { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; background: linear-gradient(145deg, #fde48e 0%, #e6be4ae0 100%); }
        #details-screen { display: none; }
        .screen-header { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; color: #3b2c0d; }
        .btn-main { background: #fff3c4; color: #3b2c0d; font-weight: bold; padding: 14px; border-radius: 8px; border: 2px solid #7c5d12; text-align: center; cursor: pointer; margin-bottom: 15px; }
        .add-comp-box { background: #fce89c; border: 2px solid #7c5d12; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: none; flex-direction: column; gap: 8px; }
        .add-comp-box input { width: 100%; padding: 10px; border-radius: 6px; border: 2px solid #7c5d12; background: #fff5cc; font-size: 16px; }
        .competition-item { background: #fff5cc; border: 2px solid #7c5d12; border-radius: 8px; padding: 15px; margin-bottom: 10px; text-align: center; font-weight: bold; cursor: pointer; position: relative; }
        .delete-comp-btn { position: absolute; top: 5px; left: 8px; background: #a83232; color: #fff; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .internal-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .internal-modal-card { background: #fde48e; padding: 20px; border-radius: 12px; width: 100%; text-align: center; border: 3px solid #573f06; }
        .btn-confirm { padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }
    </style>
</head>
<body onclick="goFullScreen()">

    <div class="mobile-frame">
        <div id="home-screen">
            <div class="screen-header">قائمة المسابقات</div>
            <button class="btn-main" onclick="toggleAddCompBox()">+ إضافة مسابقة جديدة</button>
            <div id="add-comp-container" class="add-comp-box">
                <input type="text" id="new-comp-name" placeholder="اسم المسابقة...">
                <button class="btn-main" onclick="addNewComp()">حفظ</button>
            </div>
            <div id="comps-list"></div>
        </div>

        <div id="details-screen">
            <div class="screen-header" id="comp-title"></div>
            <button class="btn-main" onclick="goHome()">رجوع</button>
            <div id="participants-list"></div>
        </div>
    </div>

    <!-- نافذة تأكيد حذف داخلية -->
    <div id="delete-modal" class="internal-modal">
        <div class="internal-modal-card">
            <h3 id="del-text">هل أنت متأكد؟</h3>
            <button class="btn-confirm" style="background:#a83232; color:#fff;" onclick="confirmDelete()">نعم</button>
            <button class="btn-confirm" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        // تفعيل ملء الشاشة عند أول لمسة
        function goFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        let comps = JSON.parse(localStorage.getItem('appComps')) || {};
        let delTarget = null;

        function toggleAddCompBox() {
            let box = document.getElementById('add-comp-container');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function addNewComp() {
            let name = document.getElementById('new-comp-name').value.trim();
            if (name) {
                comps[name] = [];
                localStorage.setItem('appComps', JSON.stringify(comps));
                renderComps();
                toggleAddCompBox();
            }
        }

        function renderComps() {
            let list = document.getElementById('comps-list');
            list.innerHTML = "";
            Object.keys(comps).forEach(name => {
                let div = document.createElement('div');
                div.className = 'competition-item';
                div.innerHTML = `${name} <span class="delete-comp-btn" onclick="event.stopPropagation(); promptDelete('${name}')">×</span>`;
                div.onclick = () => openComp(name);
                list.appendChild(div);
            });
        }

        function promptDelete(name) {
            delTarget = name;
            document.getElementById('del-text').innerText = `حذف "${name}"؟`;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('delete-modal').style.display = 'none'; }

        function confirmDelete() {
            delete comps[delTarget];
            localStorage.setItem('appComps', JSON.stringify(comps));
            renderComps();
            closeModal();
        }

        function openComp(name) {
            document.getElementById('comp-title').innerText = name;
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('details-screen').style.display = 'flex';
        }

        function goHome() {
            document.getElementById('details-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
        }

        window.onload = renderComps;
    </script>
</body>
</html>

<script>
        // ... (نفس الدوال السابقة الخاصة بالصوت والبيانات) ...

        // تحديث دالة رسم العجلة (إزالة الإطار الأبيض)
        function drawWheel(angle) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 30;

            ctx.clearRect(0, 0, width, height);

            let totalSlices = currentRoulettePool.length;
            if (totalSlices === 0) return;

            let arcSize = (2 * Math.PI) / totalSlices;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);

            for (let i = 0; i < totalSlices; i++) {
                let startAngle = i * arcSize;
                let endAngle = (i + 1) * arcSize;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = currentRoulettePool[i].color;
                ctx.fill();
                // تم إزالة ctx.stroke(); الذي كان يرسم الحد الأبيض حول العجلة
            }

            ctx.restore();

            // الدائرة المركزية
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, 2 * Math.PI);
            ctx.fillStyle = "#d4af37";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#573f06";
            ctx.stroke();
        }

        // تحديث دالة تدوير العجلة (التزامن الدقيق مع الوقت)
        function spinWheel() {
            if (isSpinning || currentRoulettePool.length === 0) return;
            isSpinning = true;
            playEffect('start');
            document.getElementById('winner-banner').style.display = 'none';

            let duration = parseFloat(document.getElementById('spinDurationRange').value) * 1000;
            // جعل سرعة اللف ديناميكية حسب المدة المختارة
            let extraRotations = 5 + Math.floor(Math.random() * 3); 
            let randomAngle = Math.random() * 2 * Math.PI;
            let targetAngle = wheelAngle + (extraRotations * 2 * Math.PI) + randomAngle;

            let startTime = null;

            function animateSpin(currentTime) {
                if (!startTime) startTime = currentTime;
                let elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                // دالة التباطؤ (Ease Out)
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                
                // تحديث الزاوية بناءً على الوقت المنقضي
                wheelAngle = (targetAngle * easeProgress) % (2 * Math.PI);
                drawWheel(wheelAngle);

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    // هنا ينتهي الوقت بالضبط
                    isSpinning = false;
                    determineWinner();
                }
            }

            requestAnimationFrame(animateSpin);
        }

        // ... (باقي الدوال تبقى كما هي) ...
    </script>
